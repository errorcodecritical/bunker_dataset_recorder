services:
  # --- iceoryx shared memory broker -----------------------------------------
  # One per robot. Every other service depends on this and shares its IPC
  # namespace so they can all see the same POSIX shm segments/semaphores.
  roudi:
    build:
      context: ..
      dockerfile: docker/roudi/Dockerfile
    image: ros2_roudi:latest
    container_name: roudi
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/iceoryx/roudi_config.toml:/roudi_config.toml
    environment:
      - IOX_DOMAIN_ID=0
    command:
      - bash
      - -c
      - | 
        echo '=== Starting RouDi ==='
        umask 0000
        iox-roudi -c /roudi_config.toml

  xsens_driver:
    build:
      context: ..
      dockerfile: docker/xsens/Dockerfile
    image: ros2_xsens_driver:latest
    container_name: xsens
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - ../config/xsens/mtdevice.py:/ros2_ws/src/norlab_xsens_driver/xsens_driver/mtdevice.py
      - ../config/xsens/mtnode.py:/ros2_ws/src/norlab_xsens_driver/xsens_driver/mtnode.py
      - ../config/xsens/xsens_driver.launch.xml:/ros2_ws/src/norlab_xsens_driver/launch/xsens_driver.launch.xml
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting XSENS driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        colcon build --symlink-install --packages-select xsens_driver --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /ros2_ws/install/setup.bash
        ros2 launch xsens_driver xsens_driver.launch.xml

  emlid_driver:
    build:
      context: ..
      dockerfile: docker/emlid/Dockerfile
    image: ros2_emlid_driver:latest
    container_name: emlid
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - ../config/emlid/nmea_serial_driver.py:/ros2_ws/src/nmea_navsat_driver/src/libnmea_navsat_driver/nodes/nmea_serial_driver.py
      - ../config/emlid/nmea_serial_driver.yaml:/ros2_ws/src/nmea_navsat_driver/config/nmea_serial_driver.yaml
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting EMLID driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        colcon build --symlink-install --packages-select nmea_navsat_driver --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /ros2_ws/install/setup.bash
        ros2 run nmea_navsat_driver nmea_serial_driver

  oakd_driver:
    build:
      context: ..
      dockerfile: docker/oakd/Dockerfile
    image: ros2_oakd_driver:latest
    container_name: oakd
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
