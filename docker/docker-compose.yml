      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - ../config/oakd/depthai_ros_driver/config:/opt/ros/jazzy/share/depthai_ros_driver/config
      - ../config/oakd/depthai_ros_driver/launch:/opt/ros/jazzy/share/depthai_ros_driver/launch
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting OAK-D driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        source /ros2_ws/install/setup.bash
        ros2 launch depthai_ros_driver camera.launch.py

  hesai_driver:
    build:
      context: ..
      dockerfile: docker/hesai/Dockerfile
    image: ros2_hesai_driver:latest
    container_name: hesai
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - ../config/hesai/config.yaml:/ros2_ws/src/HesaiLidar_ROS_2.0/config/config.yaml
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting HESAI driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        colcon build --symlink-install --packages-select hesai_ros_driver --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /ros2_ws/install/setup.bash
        ros2 run hesai_ros_driver hesai_ros_driver_node

  atlas_driver:
    build:
      context: ..
      dockerfile: docker/atlas/Dockerfile
    image: ros2_atlas_driver:latest
    container_name: atlas
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting ATLAS driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        colcon build --symlink-install --packages-select aeva_msgs ros2_aeva_publisher --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /ros2_ws/install/setup.bash
        ros2 run ros2_aeva_publisher ros2_aeva_publisher 10.1.14.24 ATLAS

  hugin_driver:
    build:
      context: ..
      dockerfile: docker/hugin/Dockerfile
    image: ros2_hugin_driver:latest
    container_name: hugin
    privileged: true
    user: "0:0"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - ../shared/hugin/ros2/src/:/opt/ros/overlay_ws/src/
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting HUGIN driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        colcon build --symlink-install --packages-select hugin_d1 hugin_d1_gui liboden oden oden_interfaces oden_mqtt_bridge raf2_interfaces runes yggdrasil ymir --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /ros2_ws/install/setup.bash
        (sleep 5
        ros2 service call /sensrad/radar_1/set_active_seq raf2_interfaces/srv/RdrCtrlSetActiveSeq "{requested_sequence_id: 2}"
        sleep 1
        ros2 service call /sensrad/radar_1/start_tx raf2_interfaces/srv/RdrCtrlStartTx
        sleep 1
        ros2 service call /sensrad/radar_1/set_thresholds raf2_interfaces/srv/RdrCtrlSetThresholds "{static_threshold: 10.0, dynamic_azimuth: 15.0, dynamic_elevation: 15.0, dynamic_basic: 15.0}") &
        ros2 launch yggdrasil sensrad.launch.py visualizer:=none

  bunker_driver:
    build:
      context: ..
      dockerfile: docker/bunker/Dockerfile
    image: ros2_bunker_driver:latest
    container_name: bunker_driver
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    restart: unless-stopped
    volumes:
      - /dev:/dev
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - ../config/bunker:/config/bunker
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        echo "=== Starting BUNKER driver ==="
        until [ -e /dev/shm/iceoryx_mgmt ]; do
          echo "waiting for RouDi shared memory..."
          sleep 1
        done
        colcon build --symlink-install --packages-select ugv_sdk bunker_msgs bunker_base bunker_description --cmake-args -DCMAKE_BUILD_TYPE=Release
        source /ros2_ws/install/setup.bash

        # 1. Wait quietly until the CAN interface appears, then configure it
        until ip link show can2 >/dev/null 2>&1; do sleep 2; done
        ip link set can2 down || true
        ip link set can2 up type can bitrate 500000

        # 2. Crash out if the CAN configuration fails to initialize
        ip link show can2 | grep -q "UP" || { echo "CAN interface failed"; exit 1; }

        # 3. Launch Chassis Core processes to the background
        ros2 launch bunker_base bunker_base.launch.py use_sim_time:=false port_name:=can2 odom_frame:=odom base_frame:=base_link odom_topic_name:=bunker_odom is_bunker_mini:=true simulated_robot:=false control_rate:=50 &
        ros2 launch bunker_description robot_state_publisher.launch.py &
        ros2 run twist_mux twist_mux --ros-args --params-file /config/bunker/twist_mux.yaml -r /cmd_vel_out:=/cmd_vel &

        # 4. Infinite Joystick Hot-Plug Loop
        while true; do
          if [ -c /dev/input/js0 ]; then
            chmod a+rw /dev/input/js0 || true
            ros2 launch teleop_twist_joy teleop-launch.py \
                joy_vel:=/cmd_vel/joy \
                joy_config:=/config/bunker/teleop_twist_joy.yaml \
                joy_dev:=0 \
                publish_stamped_twist:=false \
                config_filepath:=/config/bunker/teleop_twist_joy.yaml
          fi
          sleep 3
        done

  recorder:
    build:
      context: ..
      dockerfile: docker/recorder/Dockerfile
    image: ros2_recorder:latest
    container_name: recorder
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /dev/shm:/dev/shm
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-local.xml:/cyclonedds-config.xml
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      - DISPLAY=$DISPLAY
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command: /shared/recorder-launch.sh

  network_bridge:
    build:
      context: ..
      dockerfile: docker/roudi/Dockerfile
    image: ros2_roudi:latest
    container_name: network_bridge
    privileged: true
    user: "0:0"
    network_mode: host
    ipc: host
    volumes:
      - /dev/:/dev/
      - /tmp:/tmp
      - ../ros2_ws:/ros2_ws
      - ../config/cyclonedds/cyclonedds-bridge.xml:/cyclonedds-config.xml
      - ../config/bridge/brisge_config.yaml:/bridge_config.yaml
    environment:
      - ROS_DOMAIN_ID=30
      - IOX_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds-config.xml
    command:
      - bash
      - -c
      - |
        ros2 run domain_bridge domain_bridge /bridge_config.yaml