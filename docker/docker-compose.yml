version: '3.8'

services:
  hesai_driver:
    image: hesai_lidar_noetic:latest
    container_name: hesai_lidar_driver
    build:
      context: ./hesai
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../catkin_ws:/catkin_ws
      - ../config/hesai/config.yaml:/catkin_ws/src/HesaiLidar_ROS_2.0/config/config.yaml
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting HESAI Driver ==="
        catkin build hesai_ros_driver -j 6 -p 6
        source /catkin_ws/devel/setup.bash
        roslaunch hesai_ros_driver start.launch
    cpuset: "7-9"  # High-throughput point-cloud ingestion

  oakd_driver:
    image: oakd_noetic:latest
    container_name: oakd_driver
    build:
      context: ./oakd
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /dev/:/dev/
      - ../catkin_ws:/catkin_ws
      - ../config/oakd/depthai_ros_driver/config:/catkin_ws/src/depthai-ros/depthai_ros_driver/config
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting OAK-D Driver ==="
        catkin build depthai_ros_driver -j 6 -p 6
        source /catkin_ws/devel/setup.bash
        roslaunch depthai_ros_driver camera.launch
    cpuset: "7-9"  # Shared with Hesai to balance high-rate streaming drivers

  xsens_mti_driver:
    image: xsens_mti_noetic:latest
    container_name: xsens_mti_driver
    build:
      context: ./xsens
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /dev/:/dev/
      - ../catkin_ws:/catkin_ws
      - ../config/xsens/unbrick.py:/unbrick.py
      - ../config/xsens/xsens_mti_node.yaml:/opt/ros/noetic/share/xsens_mti_driver/param/xsens_mti_node.yaml
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting Xsens MTI ROS Driver ==="
        source /catkin_ws/devel/setup.bash
        roslaunch xsens_mti_driver xsens_mti_node.launch
    cpuset: "10-11"  # Light serial/USB sensor stream

  nmea_navsat_driver:
    image: nmea_navsat_noetic:latest
    container_name: nmea_navsat_driver
    build:
      context: ./emlid
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - /dev/:/dev/
      - ../catkin_ws:/catkin_ws
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting EMLID Driver ==="
        source /catkin_ws/devel/setup.bash
        roslaunch nmea_navsat_driver nmea_serial_driver.launch
    cpuset: "10-11"  # Light serial/USB sensor stream

  bunker_driver:
    image: bunker_driver_noetic:latest
    container_name: bunker_driver
    build:
      context: ./bunker
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../catkin_ws:/catkin_ws
      - ../config/bunker/bunker_robot_base.launch:/catkin_ws/src/bunker_ros/bunker_bringup/launch/bunker_robot_base.launch
      - ../config:/config
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting BUNKER Driver ==="
        catkin build bunker_base bunker_msgs bunker_bringup ugv_sdk -j 6 -p 6 --cmake-args -DCMAKE_CXX_FLAGS="-DASIO_ENABLE_OLD_SERVICES"
        source /catkin_ws/devel/setup.bash

        # 1. Wait quietly until the CAN interface appears, then configure it
        until ip link show can2 >/dev/null 2>&1; do sleep 2; done
        ip link set can2 down || true
        ip link set can2 up type can bitrate 500000

        # 2. Crash out if the CAN configuration fails to initialize
        ip link show can2 | grep -q "UP" || { echo "CAN interface failed"; exit 1; }

        # 3. Launch Chassis Core processes to the background
        roslaunch twist_mux twist_mux.launch config_locks:=/config/bunker/twist_mux.yaml config_topics:=/config/bunker/twist_mux.yaml cmd_vel_out:=/smoother_cmd_vel &
        roslaunch --wait bunker_bringup bunker_robot_base.launch &
        #roslaunch --wait bunker_description robot_state_publisher.launch &

        # 4. Infinite Joystick Hot-Plug Loop
        while true; do
          if [ -c /dev/input/js0 ]; then
            chmod a+rw /dev/input/js0 || true
            roslaunch --wait /config/bunker/teleop.launch joy_dev:=/dev/input/js0
          fi
          sleep 3
        done
    cpuset: "10-11"  # CAN bus communication and motion control loops

  node_monitor:
    image: ros_noetic_recorder:latest
    container_name: monitor
    build:
      context: ./recorder
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../catkin_ws:/catkin_ws
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting MONITOR ==="
        pip install docker
        catkin build node_monitor -j 6 -p 6
        source /catkin_ws/devel/setup.bash
        roscore &
        rosrun node_monitor monitor.py &
        rostopic echo /node_metrics
    cpuset: "10-11"  # Monitoring/telemetry thread overhead

  ig_lio:
    image: ig_lio_noetic:latest
    container_name: ig_lio
    build:
      context: ./ig_lio
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    volumes:
      - ../catkin_ws:/catkin_ws
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting IG-LIO ==="
        catkin build ig_lio -j 6 -p 6 --cmake-args -DCMAKE_CXX_FLAGS="-DASIO_ENABLE_OLD_SERVICES"
        source /catkin_ws/devel/setup.bash
        roslaunch ig_lio lio_hesai.launch
    cpuset: "0-5"  # Heavy SLAM block (Mutually exclusive with PUTN)

  putn:
    image: putn_noetic:latest
    container_name: putn
    build:
      context: ./putn
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - ../catkin_ws:/catkin_ws
      - /dev/:/dev/
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:rw
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting PUTN ==="
        catkin build aloam_velodyne gpr local_planner putn putn_launch putn_map rviz_plugins scout_control scout_description scout_gazebo_sim waypoint_generator
        source /catkin_ws/devel/setup.bash
        roslaunch putn_launch bringup.launch rviz_putn:=false
    cpuset: "0-6"  # Heavy Navigation block (Mutually exclusive with IG-LIO)

  recorder:
    image: ros_noetic_recorder:latest
    container_name: recorder
    build:
      context: ./recorder
      dockerfile: Dockerfile
    init: true
    tty: true
    stdin_open: true
    privileged: true
    network_mode: host
    restart: unless-stopped
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XAUTHORITY=/tmp/.Xauthority
    volumes:
      - ../catkin_ws:/catkin_ws
      - ../rosbags:/rosbags
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ~/.Xauthority:/tmp/.Xauthority:rw
    command:
      - /bin/bash
      - -c
      - |
        sleep 3
        echo "=== Starting RECORDER ==="
        source /catkin_ws/devel/setup.bash
        roscore &
        sleep 1
        rosbag record -O /rosbags/$(date +%Y_%m_%d_%H_%M_%S)_recording.bag \
          /hesai/points \
          /oak/rgb/image_raw \
          /oak/stereo/image_raw \
          /oak/imu/data \
          /imu/data \
          /imu/mag \
          /fix \
          /odom \
          /cmd_vel
    cpuset: "6"  # Dedicated single core for I/O disk writes without blocking active algorithms