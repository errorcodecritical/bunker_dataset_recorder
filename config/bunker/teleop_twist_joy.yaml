# Configured for 8BITJOY to match RC controller
/teleop_twist_joy_node:
  ros__parameters:
    axis_linear:
      x: 1
    scale_linear:
      x: 0.4
    axis_angular:
      yaw: 2
    scale_angular:
      yaw: 1.2
    
    # Enable the requirement for deadman switches
    require_enable_button: true
    enable_button: 6
    enable_turbo_button: 7
    publish_stamped_twist: false

    # Correct structure for turbo modifiers
    turbo:
      scale_linear:
        x: 3.8
      scale_angular:
        yaw: 3.6

/joy_node:
  ros__parameters:
    deadzone: 0.1
    autorepeat_rate: 20.0
    dev: "/dev/input/js0"
